[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-selection-pilot"
version = "0.1.0"
description = "A controlled pilot of explanation and information-seeking choices"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evidence-selection = "evidence_selection.__main__:main"

[tool.setuptools.packages.find]
include = ["evidence_selection*"]
